<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="640" viewBox="0 0 1200 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F5FBF"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="638" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>

  <!-- zones -->
  <g fill="none" stroke="#8A9AA8" stroke-width="1.2" stroke-dasharray="6 4">
    <rect x="24" y="24" width="248" height="392" rx="10"/>
    <rect x="288" y="24" width="560" height="392" rx="10"/>
    <rect x="864" y="24" width="312" height="392" rx="10"/>
  </g>
  <g font-size="15" fill="#5A6875" letter-spacing="1.2">
    <text x="40" y="52">TASK, 100 TEST FLIGHTS</text>
    <text x="304" y="52">SIMULATION AND TRAINING</text>
    <text x="880" y="52">RESULT</text>
  </g>

  <!-- inputs -->
  <g stroke="#C97A2B" stroke-width="1.5" fill="#FBE5CF">
    <rect x="40" y="80" width="216" height="80" rx="10"/>
    <rect x="40" y="184" width="216" height="80" rx="10"/>
    <rect x="40" y="288" width="216" height="80" rx="10"/>
  </g>
  <g fill="#15202A" text-anchor="middle">
    <text x="148" y="114" font-size="22">Setpoint</text>
    <text x="148" y="142" font-size="16" fill="#5A6875">speed, altitude, course</text>
    <text x="148" y="218" font-size="22">Wind</text>
    <text x="148" y="246" font-size="16" fill="#5A6875">≤ 5 m/s, Dryden, noise</text>
    <text x="148" y="322" font-size="22">Airframe</text>
    <text x="148" y="350" font-size="16" fill="#5A6875">Aerosonde, PX4 plane</text>
  </g>
  <g stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="256" y1="120" x2="310" y2="120"/>
    <line x1="256" y1="224" x2="310" y2="224"/>
    <line x1="256" y1="328" x2="310" y2="328"/>
  </g>

  <!-- simulator -->
  <rect x="312" y="80" width="200" height="288" rx="10" fill="#DCF1EE" stroke="#0D7A6F" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#15202A">
    <text x="412" y="170" font-size="24">Simulator</text>
    <text x="412" y="200" font-size="16" fill="#5A6875">6-DOF, RK4, 100 Hz</text>
    <text x="412" y="224" font-size="16" fill="#5A6875">NumPy and C++</text>
    <text x="412" y="260" font-size="15" fill="#0D7A6F">C++ = Python</text>
    <text x="412" y="280" font-size="15" fill="#0D7A6F">to 7e-13 on 7136 steps</text>
  </g>

  <!-- actor / critic -->
  <rect x="648" y="80" width="184" height="88" rx="10" fill="#E2EBFA" stroke="#1F5FBF" stroke-width="1.5"/>
  <rect x="648" y="232" width="184" height="80" rx="10" fill="#F1F4F6" stroke="#1F5FBF" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#15202A">
    <text x="740" y="116" font-size="24">SAC actor</text>
    <text x="740" y="144" font-size="16" fill="#5A6875">MLP 64-64</text>
    <text x="740" y="266" font-size="22">Critics</text>
    <text x="740" y="292" font-size="16" fill="#5A6875">MLP 256-256</text>
  </g>
  <g stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="512" y1="104" x2="646" y2="104"/>
    <line x1="648" y1="148" x2="514" y2="148"/>
    <line x1="512" y1="272" x2="646" y2="272"/>
  </g>
  <g font-size="15" fill="#5A6875" text-anchor="middle">
    <text x="580" y="96">60 obs</text>
    <text x="580" y="172">4 surfaces, 50 Hz</text>
    <text x="580" y="264">reward, air data</text>
  </g>
  <path d="M740,232 L740,170" stroke="#1F5FBF" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ahb)"/>
  <text x="752" y="206" font-size="15" fill="#1F5FBF">Q gradient</text>

  <!-- PID baseline -->
  <rect x="648" y="336" width="184" height="64" rx="10" fill="#F1F4F6" stroke="#8A9AA8" stroke-width="1.5"/>
  <text x="740" y="364" font-size="20" fill="#15202A" text-anchor="middle">PID baseline</text>
  <text x="740" y="388" font-size="15" fill="#5A6875" text-anchor="middle">same sensors, bank ≤ 30°</text>
  <path d="M648,356 L516,356" stroke="#8A9AA8" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="580" y="346" font-size="15" fill="#5A6875" text-anchor="middle">same flights</text>

  <!-- to results -->
  <path d="M832,124 L878,124" stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- results -->
  <image href="ov_topdown.png" x="880" y="72" width="280" height="178" preserveAspectRatio="xMidYMid meet"/>
  <rect x="880" y="72" width="280" height="178" rx="6" fill="none" stroke="#C5CDD5" stroke-width="1"/>
  <text x="880" y="272" font-size="15" fill="#5A6875">Windy test flight, SAC vs PID</text>
  <text x="880" y="318" font-size="32" font-weight="bold" fill="#B8461F">0.59 vs 0.78 m/s</text>
  <text x="880" y="344" font-size="16" fill="#15202A">airspeed RMS in wind, SAC vs PID</text>
  <text x="880" y="372" font-size="16" fill="#5A6875">92 vs 97 of 100 flights complete</text>
  <text x="880" y="396" font-size="16" fill="#5A6875">SAC: mean of 3 seeds</text>

  <!-- bottom band -->
  <text x="40" y="456" font-size="15" fill="#5A6875" letter-spacing="1.2">IN SIMULATION</text>
  <image href="ov_3d.png" x="40" y="472" width="240" height="127"/>
  <rect x="40" y="472" width="240" height="127" rx="6" fill="none" stroke="#C5CDD5"/>
  <text x="40" y="622" font-size="15" fill="#5A6875">3D replay, first run</text>

  <image href="ov_swarm.png" x="304" y="472" width="195" height="127"/>
  <rect x="304" y="472" width="195" height="127" rx="6" fill="none" stroke="#C5CDD5"/>
  <text x="304" y="622" font-size="15" fill="#5A6875">100 flights at once, first run</text>

  <image href="ov_airspeed.png" x="523" y="472" width="252" height="127"/>
  <rect x="523" y="472" width="252" height="127" rx="6" fill="none" stroke="#C5CDD5"/>
  <text x="523" y="622" font-size="15" fill="#5A6875">Airspeed in wind: SAC (orange), PID</text>

  <g font-size="16" fill="#15202A">
    <text x="808" y="492">C++, calm air: critic 256 learns,</text>
    <text x="808" y="514">critic 64 never learns the course</text>
    <text x="808" y="550">Actor flown by a ROS 2 node</text>
    <text x="808" y="572">on PX4 SITL in Gazebo</text>
    <text x="808" y="608" fill="#5A6875">Simulation only, no real flight yet</text>
  </g>
</svg>
